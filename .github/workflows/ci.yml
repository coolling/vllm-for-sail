# flytiger-eco 组织 PR 门禁 + PPU per-PR CI 编排入口：
#   precheck → (smoke-test ∥ ai-code-review ∥ build-wheel)
#            → human-review | skip-human-review → PPU area ×3 → Full CI
#
# - precheck / ai-code-review / human-review 是 flytiger-eco/.github 的
#   reusable workflow，本文件只做编排。
# - 标签 skip-human-review：跳过真人审批，改走本地 skip-human-review job。
# - human-review 受托管 runner 6h 上限约束；超时后有人 approve 会自动重跑。
# - 其他标签及非 approve 的 review 也会触发 run，这类 run 全部跳过。

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read # 透传 area：callee 权限只降不升
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'labeled' && github.event.label.name != 'skip-human-review') || (github.event_name == 'pull_request_review' && github.event.review.state != 'approved')) && 'noop' || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

jobs:
  # 判定是否执行流水线；approve 仅在本 commit 尚无审批通过时执行。
  # fork PR 的 approve 不执行：area 的 fork 拦截只认 pull_request 事件。
  check-run:
    name: Check Whether to Run CI
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'skip-human-review')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      run: ${{ steps.check-run.outputs.run }}
    steps:
      - id: check-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-human-review') }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [[ "$EVENT" == pull_request_review ]]; then
            run=false
            if [[ "$SAME_REPO" == true && "$HAS_SKIP_LABEL" != true ]]; then
              passed=$(gh api --paginate \
                "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
                --jq '.check_runs[]
                  | select(.conclusion == "success")
                  | select(.name == "Human Review Gate / Human Review Gate"
                           or .name == "Skip Human Review")
                  | .id')
              [[ -n "$passed" ]] || run=true
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  precheck:
    name: Pre-check
    needs: check-run
    if: needs.check-run.outputs.run == 'true'
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static smoke checks
        run: |
          for f in scripts/ppu/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # 产出主 wheel + 测试依赖 wheel，供 3 个 area 共用。
  build-wheel:
    name: Build PPU Wheel
    needs: precheck
    uses: ./.github/workflows/build-ppu-wheel.yml

  # 两条审批通道互斥，下游 area 任一 success 即放行。
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'), github.event.pull_request.base.ref)
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # GitHub 禁止作者 approve 自己的 PR，单人仓库下 human-review 会空等 6h 失败；
  # 打标签即人工授权（需 triage 权限，PR 时间线留痕）。
  skip-human-review:
    name: Skip Human Review
    needs: [smoke-test, ai-code-review]
    if: >-
      contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record skip human review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "✅ 已根据 skip-human-review 标签跳过 human review。"
          echo "PR   : $PR_URL"
          echo "base : $BASE_REF   head: $HEAD_REF"
          echo "依据：标签由具 triage 权限者添加，PR 时间线留痕可审计。"

  ppu-attention:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-attention.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-samplers:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-samplers.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-benchmarks:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-benchmarks.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  # 聚合点：审批通道至少一个成功，其余 job 全部成功；precheck 被跳过的 run 不出结论。
  ci:
    name: Full CI
    needs:
      - check-run
      - precheck
      - smoke-test
      - ai-code-review
      - build-wheel
      - human-review
      - skip-human-review
      - ppu-attention
      - ppu-samplers
      - ppu-benchmarks
    if: >-
      !cancelled() &&
      (needs.precheck.result != 'skipped' ||
       needs.check-run.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          for job, info in needs.items():
              print('{}: {}'.format(job, info.get('result', 'unknown')))

          required_success = (
              'precheck', 'smoke-test', 'ai-code-review', 'build-wheel',
              'ppu-attention', 'ppu-samplers', 'ppu-benchmarks',
          )
          failed = [
              '{} ({})'.format(
                  job, needs.get(job, {}).get('result', 'missing'))
              for job in required_success
              if needs.get(job, {}).get('result') != 'success'
          ]

          approval_jobs = ('human-review', 'skip-human-review')
          if not any(
              needs.get(job, {}).get('result') == 'success'
              for job in approval_jobs
          ):
              failed.append('approval gate (no successful channel)')

          if failed:
              print('Failed jobs: ' + ','.join(failed))
              sys.exit(1)
          print('All required jobs completed successfully')
          "
